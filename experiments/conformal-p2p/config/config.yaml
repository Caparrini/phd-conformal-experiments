## Data
data:
  source: "lending_club"
  file: "data/cleaned/lending_club.parquet"
  target: "Default"
  features:
    numerical:
      - fico_n
      - dti_n
      - loan_amnt
      - revenue
    categorical:
      - emp_length
      - purpose
      - home_ownership_n
      - addr_state
  splits:
    train_cutoff: "2015-07-31"
    calibration_cutoff: "2016-06-30"
    date_column: "issue_d"

## Model
model:
  name: "XGBoost"
  params:
    base_score: 0.5
    booster: "gbtree"
    colsample_bytree: 0.46
    gamma: 18
    learning_rate: 0.077
    max_depth: 7
    min_child_weight: 1
    n_estimators: 288
    reg_alpha: 0
    reg_lambda: 1
    scale_pos_weight: 4.43
    subsample: 0.728
    random_state: 42
    objective: "binary:logistic"
    eval_metric: "logloss"

## Conformal prediction
conformal:
  alpha: 0.10
  method: "lac"

## Experiment
experiment:
  name: "conformal-p2p"
  seed: 42

## SHAP analysis
shap:
  n_background: 300
  n_explain: 2000
  nsamples: 256