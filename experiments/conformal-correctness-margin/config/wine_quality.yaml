data:
  source: "wine_quality"
  file: "data/cleaned/wine_quality.parquet"
  target: "quality_class"
  task: "multiclass"
  features:
    numerical: [fixed_acidity, volatile_acidity, citric_acid, residual_sugar, chlorides,
                free_sulfur_dioxide, total_sulfur_dioxide, density, ph, sulphates, alcohol]
    categorical: [wine_type]
  splits:
    train_size: 0.6
    calibration_size: 0.2
    seed: 42

model:
  name: "XGBoost"
  params:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    objective: "multi:softprob"
    eval_metric: "mlogloss"

conformal:
  alpha: 0.10
  method: "lac"

experiment:
  name: "conformal-correctness-margin"
  seed: 42
  run_name: "wine-xgboost"

shap:
  n_background: 50
  n_explain: 100
  nsamples: 500
