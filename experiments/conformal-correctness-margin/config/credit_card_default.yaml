data:
  source: "credit_card_default"
  file: "data/cleaned/credit_card_default.parquet"
  target: "default"
  task: "binary"
  features:
    numerical: [limit_bal, age, bill_amt1, bill_amt2, bill_amt3, bill_amt4, bill_amt5, bill_amt6, pay_amt1, pay_amt2, pay_amt3, pay_amt4, pay_amt5, pay_amt6]
    categorical: [sex, education, marriage, pay_0, pay_2, pay_3, pay_4, pay_5, pay_6]
  splits:
    train_size: 0.6
    calibration_size: 0.2
    seed: 42

model:
  name: "XGBoost"
  params:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    objective: "binary:logistic"
    eval_metric: "logloss"

conformal:
  alpha: 0.10
  method: "lac"

experiment:
  name: "conformal-correctness-margin"
  seed: 42
  run_name: "credit-card-xgboost"
