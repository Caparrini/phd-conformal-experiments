data:
  source: "globafa2026"
  file: "data/cleaned/globafa2026.parquet"
  target: "Default"
  task: "binary"
  features:
    numerical:   [fico_n, dti_n, loan_amnt, revenue]
    categorical: [emp_length, purpose, home_ownership_n, addr_state]
  splits:
    date_column: "issue_d"
    train_cutoff: "2015-07-31"
    calibration_cutoff: "2016-06-30"
  fcod:
    numerical:   [fico_n, dti_n, loan_amnt, revenue]
    categorical: [emp_length, purpose, home_ownership_n, addr_state]

model:
  name: "XGBoost"
  params:
    base_score: 0.5
    booster: "gbtree"
    colsample_bytree: 0.46
    gamma: 18
    learning_rate: 0.077
    max_depth: 7
    min_child_weight: 1
    n_estimators: 288
    reg_alpha: 0
    reg_lambda: 1
    scale_pos_weight: 4.43
    subsample: 0.728
    random_state: 42
    objective: "binary:logistic"
    eval_metric: "logloss"

conformal:
  alpha: 0.10
  method: "lac"

experiment:
  name: "globafa2026"
  seed: 42
  run_name: "globafa2026-xgboost"
  # Separate MLflow experiment for downstream robustness/validation notebooks
  # (06, 07). Keeping them out of "globafa2026" means the most-recent run of
  # the core pipeline experiment always has a logged model — these notebooks
  # never call log_model, so mixing them in makes "latest run" resolve to a
  # model-less run for anyone/anything that doesn't filter by run_name.
  analysis_experiment_name: "globafa2026-supplementary"

shap:
  n_background: 300
  n_explain: 1000
  nsamples: 1024

alpha_sensitivity:
  grid_fine:   {start: 0.01, stop: 0.31, step: 0.01}
  grid_coarse: [0.05, 0.10, 0.15, 0.20]
  transitions: [[0.05, 0.10], [0.10, 0.15], [0.15, 0.20]]
  fcod_features: [fico_n, dti_n]
  fcod:
    n_grid: 50
    percentile_range: [5, 95]
    sigma: 2.0

exact_shapley:
  n_exact: 1000
  reference_run_id: null
